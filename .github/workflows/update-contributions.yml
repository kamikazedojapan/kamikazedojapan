name: Update GitHub Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar data from GitHub
        shell: bash
        run: |
          python <<'PY'
          from calendar import month_abbr
          from datetime import date, datetime, timedelta, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          import html as html_lib
          import json
          import re

          USERNAME = "kamikazedojapan"
          URL = f"https://github.com/users/{USERNAME}/contributions"

          request = Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Referer": f"https://github.com/{USERNAME}",
                  "X-Requested-With": "XMLHttpRequest",
              },
          )

          with urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8")

          class ContributionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cells = []
                  self.tooltips = {}
                  self._tooltip_for = None
                  self._tooltip_text = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  day = attributes.get("data-date")
                  level = attributes.get("data-level")
                  if day is not None and level is not None:
                      try:
                          parsed_day = date.fromisoformat(day)
                          parsed_level = max(0, min(4, int(level)))
                      except (ValueError, TypeError):
                          pass
                      else:
                          self.cells.append({
                              "date": parsed_day,
                              "level": parsed_level,
                              "id": attributes.get("id"),
                              "label": attributes.get("aria-label") or attributes.get("title"),
                          })

                  if tag == "tool-tip":
                      self._tooltip_for = attributes.get("for")
                      self._tooltip_text = []

              def handle_data(self, data):
                  if self._tooltip_for is not None:
                      self._tooltip_text.append(data)

              def handle_endtag(self, tag):
                  if tag == "tool-tip" and self._tooltip_for is not None:
                      text = html_lib.unescape("".join(self._tooltip_text)).strip()
                      self.tooltips[self._tooltip_for] = text
                      self._tooltip_for = None
                      self._tooltip_text = []

          def parse_count(text):
              if not text:
                  return None
              match = re.search(r"\b(\d[\d,]*)\s+contributions?\b", text, re.IGNORECASE)
              if match:
                  return int(match.group(1).replace(",", ""))
              if re.search(r"\bNo\s+contributions?\b", text, re.IGNORECASE):
                  return 0
              return None

          parser = ContributionParser()
          parser.feed(page)

          if not parser.cells:
              raise RuntimeError("No GitHub contribution cells were found in the response.")

          by_date = {}
          for cell in parser.cells:
              count = parse_count(cell.get("label"))
              if count is None and cell.get("id"):
                  count = parse_count(parser.tooltips.get(cell["id"]))
              if count is None and cell["level"] == 0:
                  count = 0
              if count is None:
                  raise RuntimeError(
                      f"Exact contribution count was not found for {cell['date'].isoformat()}."
                  )

              by_date[cell["date"]] = {
                  "date": cell["date"],
                  "level": cell["level"],
                  "count": count,
              }

          cells = [by_date[day] for day in sorted(by_date)]
          first_day = cells[0]["date"]
          last_day = cells[-1]["date"]
          anchor = first_day - timedelta(days=(first_day.weekday() + 1) % 7)

          square = 10
          gap = 3
          step = square + gap
          left = 31
          top = 20

          max_week = max((cell["date"] - anchor).days // 7 for cell in cells)
          grid_width = (max_week + 1) * step
          width = left + grid_width + 12
          height = 128

          colors = {
              0: "#161b22",
              1: "#0e4429",
              2: "#006d32",
              3: "#26a641",
              4: "#39d353",
          }

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}" role="img" aria-label="GitHub contribution calendar for {USERNAME}">',
              '<style>text{fill:#8b949e;font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>',
          ]

          month_cursor = date(first_day.year, first_day.month, 1)
          previous_x = -100
          while month_cursor <= last_day:
              week = (month_cursor - anchor).days // 7
              x = left + max(0, week) * step
              if x - previous_x >= 28:
                  label = html_lib.escape(month_abbr[month_cursor.month])
                  parts.append(f'<text x="{x}" y="10">{label}</text>')
                  previous_x = x
              if month_cursor.month == 12:
                  month_cursor = date(month_cursor.year + 1, 1, 1)
              else:
                  month_cursor = date(month_cursor.year, month_cursor.month + 1, 1)

          for label, row in (("Mon", 1), ("Wed", 3), ("Fri", 5)):
              y = top + row * step + 9
              parts.append(f'<text x="0" y="{y}">{label}</text>')

          for cell in cells:
              day = cell["date"]
              level = cell["level"]
              count = cell["count"]
              week = (day - anchor).days // 7
              weekday = (day.weekday() + 1) % 7
              x = left + week * step
              y = top + weekday * step
              noun = "contribution" if count == 1 else "contributions"
              title = html_lib.escape(f"{count} {noun} on {day.isoformat()}")
              parts.append(
                  f'<rect x="{x}" y="{y}" width="{square}" height="{square}" rx="2" '
                  f'fill="{colors[level]}" data-date="{day.isoformat()}" data-level="{level}" data-count="{count}">'
                  f'<title>{title}</title></rect>'
              )

          legend_y = 116
          legend_x = max(left, width - 119)
          parts.append(f'<text x="{legend_x}" y="{legend_y + 8}">Less</text>')
          legend_square_x = legend_x + 27
          for level in range(5):
              x = legend_square_x + level * step
              parts.append(
                  f'<rect x="{x}" y="{legend_y}" width="{square}" height="{square}" rx="2" fill="{colors[level]}" />'
              )
          parts.append(f'<text x="{legend_square_x + 5 * step + 2}" y="{legend_y + 8}">More</text>')

          parts.append("</svg>")
          svg = "\n".join(parts) + "\n"

          svg_output = Path("assets/github-contributions.svg")
          svg_output.parent.mkdir(parents=True, exist_ok=True)
          svg_output.write_text(svg, encoding="utf-8")

          data_output = Path("docs/contributions/data.json")
          data_output.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "username": USERNAME,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "from": first_day.isoformat(),
              "to": last_day.isoformat(),
              "total": sum(cell["count"] for cell in cells),
              "days": [
                  {
                      "date": cell["date"].isoformat(),
                      "level": cell["level"],
                      "count": cell["count"],
                  }
                  for cell in cells
              ],
          }
          data_output.write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit updated contribution calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contributions.svg docs/contributions/data.json

          if git diff --cached --quiet; then
            echo "Contribution calendar is already up to date."
            exit 0
          fi

          git commit -m "chore: update GitHub contribution calendar"
          git push
