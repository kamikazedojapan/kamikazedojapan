name: Update GitHub Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar SVG from GitHub
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          USERNAME = "kamikazedojapan"
          URL = f"https://github.com/users/{USERNAME}/contributions"

          request = Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          )

          with urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8")

          match = re.search(
              r'(<svg\b[^>]*class="[^"]*(?:js-calendar-graph-svg|ContributionCalendar-grid)[^"]*"[^>]*>.*?</svg>)',
              html,
              re.DOTALL,
          )

          if not match:
              match = re.search(r'(<svg\b[^>]*>.*?</svg>)', html, re.DOTALL)

          if not match:
              raise RuntimeError("GitHub contribution SVG was not found in the response.")

          svg = match.group(1)

          if "xmlns=" not in svg[:300]:
              svg = svg.replace(
                  "<svg ",
                  '<svg xmlns="http://www.w3.org/2000/svg" ',
                  1,
              )

          style = r'''<style>
          :root { color-scheme: dark; }
          .ContributionCalendar-label {
            fill: #8b949e !important;
            font: 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }
          .ContributionCalendar-day[data-level="0"] { fill: #161b22 !important; }
          .ContributionCalendar-day[data-level="1"] { fill: #0e4429 !important; }
          .ContributionCalendar-day[data-level="2"] { fill: #006d32 !important; }
          .ContributionCalendar-day[data-level="3"] { fill: #26a641 !important; }
          .ContributionCalendar-day[data-level="4"] { fill: #39d353 !important; }
          rect[data-level="0"] { fill: #161b22 !important; }
          rect[data-level="1"] { fill: #0e4429 !important; }
          rect[data-level="2"] { fill: #006d32 !important; }
          rect[data-level="3"] { fill: #26a641 !important; }
          rect[data-level="4"] { fill: #39d353 !important; }
          text {
            fill: #8b949e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }
          </style>'''

          opening_tag_end = svg.find(">") + 1
          svg = svg[:opening_tag_end] + style + svg[opening_tag_end:]

          output = Path("assets/github-contributions.svg")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(svg + "\n", encoding="utf-8")
          PY

      - name: Commit updated contribution calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contributions.svg

          if git diff --cached --quiet; then
            echo "Contribution calendar is already up to date."
            exit 0
          fi

          git commit -m "chore: update GitHub contribution calendar"
          git push
