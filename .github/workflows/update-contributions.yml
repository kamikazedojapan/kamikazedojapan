name: Update GitHub Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar SVG from GitHub
        shell: bash
        run: |
          python <<'PY'
          from calendar import month_abbr
          from datetime import date, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          import html as html_lib

          USERNAME = "kamikazedojapan"
          URL = f"https://github.com/users/{USERNAME}/contributions"

          request = Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          )

          with urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8")

          class ContributionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cells = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  day = attributes.get("data-date")
                  level = attributes.get("data-level")
                  if day is None or level is None:
                      return
                  try:
                      parsed_day = date.fromisoformat(day)
                      parsed_level = max(0, min(4, int(level)))
                  except (ValueError, TypeError):
                      return
                  self.cells.append((parsed_day, parsed_level))

          parser = ContributionParser()
          parser.feed(page)

          if not parser.cells:
              raise RuntimeError("No GitHub contribution cells were found in the response.")

          cells = sorted(set(parser.cells), key=lambda item: item[0])
          first_day = cells[0][0]
          last_day = cells[-1][0]
          anchor = first_day - timedelta(days=(first_day.weekday() + 1) % 7)

          square = 10
          gap = 3
          step = square + gap
          left = 31
          top = 20

          max_week = max((day - anchor).days // 7 for day, _ in cells)
          grid_width = (max_week + 1) * step
          width = left + grid_width + 12
          height = 128

          colors = {
              0: "#161b22",
              1: "#0e4429",
              2: "#006d32",
              3: "#26a641",
              4: "#39d353",
          }

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}" role="img" aria-label="GitHub contribution calendar for {USERNAME}">',
              '<style>text{fill:#8b949e;font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>',
          ]

          # Month labels, positioned like GitHub's contribution calendar.
          month_cursor = date(first_day.year, first_day.month, 1)
          previous_x = -100
          while month_cursor <= last_day:
              week = (month_cursor - anchor).days // 7
              x = left + max(0, week) * step
              if x - previous_x >= 28:
                  label = html_lib.escape(month_abbr[month_cursor.month])
                  parts.append(f'<text x="{x}" y="10">{label}</text>')
                  previous_x = x
              if month_cursor.month == 12:
                  month_cursor = date(month_cursor.year + 1, 1, 1)
              else:
                  month_cursor = date(month_cursor.year, month_cursor.month + 1, 1)

          # GitHub-style weekday labels.
          for label, row in (("Mon", 1), ("Wed", 3), ("Fri", 5)):
              y = top + row * step + 9
              parts.append(f'<text x="0" y="{y}">{label}</text>')

          # Contribution squares using GitHub's dark-theme color scale.
          for day, level in cells:
              week = (day - anchor).days // 7
              weekday = (day.weekday() + 1) % 7
              x = left + week * step
              y = top + weekday * step
              parts.append(
                  f'<rect x="{x}" y="{y}" width="{square}" height="{square}" rx="2" '
                  f'fill="{colors[level]}" data-date="{day.isoformat()}" data-level="{level}" />'
              )

          # Contribution legend.
          legend_y = 116
          legend_x = max(left, width - 119)
          parts.append(f'<text x="{legend_x}" y="{legend_y + 8}">Less</text>')
          legend_square_x = legend_x + 27
          for level in range(5):
              x = legend_square_x + level * step
              parts.append(
                  f'<rect x="{x}" y="{legend_y}" width="{square}" height="{square}" rx="2" fill="{colors[level]}" />'
              )
          parts.append(f'<text x="{legend_square_x + 5 * step + 2}" y="{legend_y + 8}">More</text>')

          parts.append("</svg>")
          svg = "\n".join(parts) + "\n"

          output = Path("assets/github-contributions.svg")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(svg, encoding="utf-8")
          PY

      - name: Commit updated contribution calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contributions.svg

          if git diff --cached --quiet; then
            echo "Contribution calendar is already up to date."
            exit 0
          fi

          git commit -m "chore: update GitHub contribution calendar"
          git push
