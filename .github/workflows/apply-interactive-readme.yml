name: Apply Interactive Contributions Link

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-interactive-readme.yml"

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link contribution card to interactive page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          old = '''<img
            src="./assets/github-contributions.svg"
            alt="GitHub Contributions"
            width="100%"
          />'''

          new = '''<a href="https://kamikazedojapan.github.io/kamikazedojapan/contributions/">
            <img
              src="./assets/github-contributions.svg"
              alt="GitHub Contributions"
              width="100%"
            />
          </a>'''

          if old not in text:
              raise SystemExit("Expected contribution image block was not found in README.md")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit README update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "docs: link contributions card to interactive calendar"
          git push
